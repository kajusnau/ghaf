name: Auto-assign PR author

on:
  # pull_request_target so PRs from forks get a token that can assign; no PR code is checked out.
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  is-org-member:
    # Skip running in forked repositories, since the workflow run would fail
    # due to missing repository secret(s):
    if: ${{ github.repository == 'tiiuae/ghaf' }}
    uses: ./.github/workflows/is-org-member.yml
    with:
      github-org: tiiuae
    secrets:
      read-org-members: ${{ secrets.READ_ORG_MEMBERS }}
  auto-assign-pr:
    # assigns only members of tiiuae, so unassigned PRs stand out
    needs: [is-org-member]
    if: needs.is-org-member.outputs.is_org_member == 'True'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: pozil/auto-assign-issue@af6beea6bdf1e8eb373f061c5bc168681fc6d011 # v4.0.1
        with:
          abortIfPreviousAssignees: true
          assignees: ${{ github.event.pull_request.user.login }}
